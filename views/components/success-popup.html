<div class="popup-status" data-success-popup>
  <div class="popup-status__backdrop" data-close-popup></div>
  <div class="popup-status__card">
    <button class="popup-status__close" type="button" aria-label="Закрыть" data-close-popup>
      <img class="popup-status__close-icon" src="/img/svg/close.svg" alt="" />
    </button>
    <div class="popup-status__image-wrapper">
      <img
        class="popup-status__image"
        src="/img/success-illustration.svg"
        alt="Спасибо за помощь"
      />
    </div>
    <h2 class="popup-status__title">Спасибо за вашу доброту!</h2>
    <div class="popup-status__actions">
      <a href="/" class="popup-status__button popup-status__button--primary">
        Вернуться на главную
      </a>
    </div>
  </div>
</div>
