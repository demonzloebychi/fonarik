<section class="docs">
  <div class="docs__container">
    <h2 class="docs__title">Документы</h2>
    <div class="docs__grid">
      {% for item in docs %}
        <a href="{{ item.fileUrl }}" class="docs__card" download>
          <div class="docs__card-info">
            <span class="docs__card-name">{{ item.title }}</span>
            <span class="docs__card-meta">{{ item.meta }}</span>
          </div>
          <div class="docs__card-btn" aria-label="Скачать документ">
            <svg width="26" height="26" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M13 3V17M13 17L7 11M13 17L19 11M3 23H23" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </a>
      {% endfor %}
    </div>
  </div>
</section>
