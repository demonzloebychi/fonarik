<section class="stats-banner">
  <!-- Фоновое изображение для позиционирования через z-index -->
  <picture class="stats-banner__bg-wrapper">
    <!-- Картинка для мобилок (до 768px) -->
    <source media="(max-width: 768px)" srcset="/img/main/gradients-mobile.png">
    <!-- Дефолтная картинка для десктопа -->
    <img src="/img/main/gradients.png" alt="" class="stats-banner__bg" aria-hidden="true">
  </picture>
  <!-- Контент блока -->
  <div class="stats-banner__container">
    <div class="stats-banner__content">
      <p class="stats-banner__label" data-animation="fade-up">Собрано более</p>
      <p class="stats-banner__amount">
        <span class="stats-banner__amount-price" data-animation="counter">31 375 700</span>
        <span class="stats-banner__amount-currency">₽</span>
        
      </p>
      <p class="stats-banner__description" data-animation="fade-up">
        За время работы фонда для помощи нуждающимся детям
      </p>
    </div>
  </div>
</section>
