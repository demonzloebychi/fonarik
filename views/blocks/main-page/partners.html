<div class="partners">
  <div class="container">
    <div class="partners__wrapper">
      <h2 class="h2 partners__title">Партнеры фонда</h2>
      <ul class="partners__list">
        {% for item in partners %}
        <li class="partners__item">
          <a href="{{item.url}}">
            <img src="{{item.image}}" alt="{{item.name}}" />
          </a>
        </li>
        {% endfor %}
      </ul>
    </div>
  </div>
</div>
