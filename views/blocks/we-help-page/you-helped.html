<section class="needs-help">
  <div class="needs-help__container">
    <h2 class="needs-help__title">Вы помогли</h2>

    <div class="needs-help__grid" id="user-helped-container">
      {% set helpedCount = 0 %}
      {% for child in commonData.children %}
        {% if child.youHelped and helpedCount < 3 %}
          {% include "components/child-card.html" %}
          {% set helpedCount = helpedCount + 1 %}
        {% endif %}
      {% endfor %}
    </div>

    <button type="button" class="needs-help__more-btn" data-load-more
      data-target="user-helped-container"
      data-filter="user_helped"
      data-show-count="3"
    >
      <span>Показать еще</span>
      <svg class="needs-help__more-icon" width="9" height="10" viewBox="0 0 9 10" fill="none" xmlns="http://w3.org">
        <path d="M1.5 1.5L7.5 5L1.5 8.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</section>
